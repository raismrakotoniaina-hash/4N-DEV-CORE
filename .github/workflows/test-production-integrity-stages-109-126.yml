name: Test Production Integrity Stages 109-126

on:
  workflow_dispatch:

jobs:
  production-integrity-109-126:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://fourn-dev-core.onrender.com
      API_KEY: ${{ secrets.CORE_API_KEY }}

    steps:
      - name: Stages 109-112 Project validation and persistence
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          CODE=$(curl -sS -o /tmp/no-name.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects" -d '{"description":"invalid"}')
          test "$CODE" = "400"
          CODE=$(curl -sS -o /tmp/too-long-name.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects" -d '{"name":"'$(python -c 'print("x"*121)')'"}')
          test "$CODE" = "400"
          CREATED=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects" -d '{"name":"stage-109-persistence","description":"initial"}')
          PID=$(echo "$CREATED" | python -c 'import json,sys; print(json.load(sys.stdin)["project"]["id"])')
          GOT=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/projects/$PID")
          echo "$GOT" | grep -q '"name":"stage-109-persistence"'
          UPDATED=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X PATCH "$BASE/v1/projects/$PID" -d '{"description":"persisted"}')
          echo "$UPDATED" | grep -q '"description":"persisted"'
          GOT2=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/projects/$PID")
          echo "$GOT2" | grep -q '"description":"persisted"'
          echo "Stages 109-112 passed"

      - name: Stages 113-116 File integrity and path boundaries
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          PID=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/projects" | python -c 'import json,sys; print([p["id"] for p in json.load(sys.stdin)["projects"] if p["name"]=="stage-109-persistence"][0])')
          for path in "../blocked" "../../blocked" "/etc/passwd" "C:/blocked"; do
            CODE=$(curl -sS -o /tmp/bad-path.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects/$PID/files" -d "{\"path\":\"$path\",\"content\":\"blocked\"}")
            test "$CODE" = "400"
          done
          FILE=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects/$PID/files" -d '{"path":"stage-109.txt","content":"original"}')
          FID=$(echo "$FILE" | python -c 'import json,sys; print(json.load(sys.stdin)["file"]["id"])')
          GOT=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/projects/$PID/files/$FID")
          echo "$GOT" | grep -q '"content":"original"'
          UPDATED=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X PUT "$BASE/v1/projects/$PID/files/$FID" -d '{"content":"updated"}')
          echo "$UPDATED" | grep -q '"content":"updated"'
          echo "Stages 113-116 passed"

      - name: Stages 117-120 Credit and rejected-request safety
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          BEFORE=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits")
          B=$(echo "$BEFORE" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          for BODY in '{"input":null}' '{"input":123}' '{}'; do
            CODE=$(curl -sS -o /tmp/rejected.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/chat" -d "$BODY")
            test "$CODE" = "400"
          done
          AFTER=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits")
          A=$(echo "$AFTER" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          test "$B" = "$A"
          CODE=$(curl -sS -o /tmp/no-auth.json -w "%{http_code}" "$BASE/v1/credits")
          test "$CODE" = "401"
          echo "Stages 117-120 passed"

      - name: Stages 121-124 Rate-limit and API recovery
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          for i in 1 2 3 4 5; do
            curl -fsS "$BASE/health" | grep -q '"status":"online"'
            curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/me" | grep -q '"active":true'
          done
          CODE=$(curl -sS -o /tmp/invalid-key.json -w "%{http_code}" -H "Authorization: Bearer invalid-stage-121-key" "$BASE/v1/me")
          test "$CODE" = "401"
          curl -fsS "$BASE/health" | grep -q '"success":true'
          echo "Stages 121-124 passed"

      - name: Stages 125-126 Cleanup and final certification
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          PID=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/projects" | python -c 'import json,sys; print([p["id"] for p in json.load(sys.stdin)["projects"] if p["name"]=="stage-109-persistence"][0])')
          curl -fsS -H "Authorization: Bearer $KEY" -X DELETE "$BASE/v1/projects/$PID" | grep -q '"deleted":true'
          CODE=$(curl -sS -o /tmp/deleted.json -w "%{http_code}" -H "Authorization: Bearer $KEY" "$BASE/v1/projects/$PID")
          test "$CODE" = "404"
          curl -fsS "$BASE/health" | grep -q '"status":"online"'
          curl -fsS "$BASE/v1/" | grep -q '"version":"v1"'
          curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits" | grep -q '"credits"'
          echo "PRODUCTION INTEGRITY STAGES 109-126 PASSED"
