name: Test Production Data Integrity Stages 209-224

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-production-data-integrity-stages-209-224.yml"

jobs:
  production-data-integrity:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://fourn-dev-core.onrender.com
      API_KEY: ${{ secrets.CORE_API_KEY }}

    steps:
      - name: Run stages 209-224
        shell: bash
        run: |
          set -euo pipefail

          auth=(-H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json")

          echo "209-212: project persistence"
          PJSON=$(curl -fsS "${auth[@]}" -X POST "$BASE_URL/v1/projects"             -d '{"name":"stage209-project","description":"initial-state"}')
          PID=$(python -c 'import json,sys; print(json.load(sys.stdin)["project"]["id"])' <<<"$PJSON")

          curl -fsS "${auth[@]}" "$BASE_URL/v1/projects/$PID" > /tmp/project1.json
          python -c 'import json; d=json.load(open("/tmp/project1.json")); p=d.get("project",d); assert p["id"]=="'$PID'"; assert p["name"]=="stage209-project"; assert p["description"]=="initial-state"'

          curl -fsS "${auth[@]}" -X PATCH "$BASE_URL/v1/projects/$PID"             -d '{"description":"persisted-update"}' > /tmp/project2.json
          python -c 'import json; d=json.load(open("/tmp/project2.json")); p=d.get("project",d); assert p["description"]=="persisted-update"'

          curl -fsS "${auth[@]}" "$BASE_URL/v1/projects/$PID" > /tmp/project3.json
          python -c 'import json; d=json.load(open("/tmp/project3.json")); p=d.get("project",d); assert p["description"]=="persisted-update"'

          echo "213-216: file state consistency"
          FJSON=$(curl -fsS "${auth[@]}" -X POST "$BASE_URL/v1/projects/$PID/files"             -d '{"path":"index.html","content":"<html>stage213</html>"}')
          FID=$(python -c 'import json,sys; print(json.load(sys.stdin)["file"]["id"])' <<<"$FJSON")

          curl -fsS "${auth[@]}" "$BASE_URL/v1/projects/$PID/files/$FID" > /tmp/file1.json
          python -c 'import json; d=json.load(open("/tmp/file1.json")); f=d.get("file",d); assert f["id"]=="'$FID'"; assert f["path"]=="index.html"; assert f["content"]=="<html>stage213</html>"'

          curl -fsS "${auth[@]}" -X PUT "$BASE_URL/v1/projects/$PID/files/$FID"             -d '{"path":"index.html","content":"<html>stage213-updated</html>"}' > /tmp/file2.json
          python -c 'import json; d=json.load(open("/tmp/file2.json")); f=d.get("file",d); assert f["content"]=="<html>stage213-updated</html>"'

          curl -fsS "${auth[@]}" "$BASE_URL/v1/projects/$PID/files/$FID" > /tmp/file3.json
          python -c 'import json; d=json.load(open("/tmp/file3.json")); f=d.get("file",d); assert f["content"]=="<html>stage213-updated</html>"'

          LIST=$(curl -fsS "${auth[@]}" "$BASE_URL/v1/projects/$PID/files")
          python -c 'import json,sys; d=json.load(sys.stdin); fs=d.get("files",[]); assert any(f["id"]=="'$FID'" and f["content"]=="<html>stage213-updated</html>" for f in fs)' <<<"$LIST"

          echo "217-220: credit integrity"
          BEFORE=$(curl -fsS "${auth[@]}" "$BASE_URL/v1/credits")
          BC=$(python -c 'import json,sys; print(json.load(sys.stdin)["credits"])' <<<"$BEFORE")

          STATUS=$(curl -sS -o /tmp/invalid-chat.json -w "%{http_code}" "${auth[@]}" -X POST "$BASE_URL/v1/chat" -d '{"input":123}')
          test "$STATUS" = "400"
          AFTER_INVALID=$(curl -fsS "${auth[@]}" "$BASE_URL/v1/credits")
          AC=$(python -c 'import json,sys; print(json.load(sys.stdin)["credits"])' <<<"$AFTER_INVALID")
          test "$AC" = "$BC"

          CHAT=$(curl -fsS "${auth[@]}" -X POST "$BASE_URL/v1/chat" -d '{"input":"stage217 credit check"}')
          USED=$(python -c 'import json,sys; print(json.load(sys.stdin)["credits_used"])' <<<"$CHAT")
          REMAIN=$(python -c 'import json,sys; print(json.load(sys.stdin)["credits_remaining"])' <<<"$CHAT")
          test "$USED" = "1"
          test "$REMAIN" = "$((BC-1))"

          STATUS=$(curl -sS -o /tmp/invalid-image.json -w "%{http_code}" "${auth[@]}" -X POST "$BASE_URL/v1/image" -d '{"prompt":"stage219","quality":"invalid"}')
          test "$STATUS" = "400"
          AFTER_IMAGE=$(curl -fsS "${auth[@]}" "$BASE_URL/v1/credits")
          AIC=$(python -c 'import json,sys; print(json.load(sys.stdin)["credits"])' <<<"$AFTER_IMAGE")
          test "$AIC" = "$REMAIN"

          echo "221-224: cleanup and final consistency"
          curl -fsS "${auth[@]}" -X DELETE "$BASE_URL/v1/projects/$PID/files/$FID" >/tmp/delete-file.json
          STATUS=$(curl -sS -o /tmp/deleted-file.json -w "%{http_code}" "${auth[@]}" "$BASE_URL/v1/projects/$PID/files/$FID")
          test "$STATUS" = "404"

          curl -fsS "${auth[@]}" -X DELETE "$BASE_URL/v1/projects/$PID" >/tmp/delete-project.json
          STATUS=$(curl -sS -o /tmp/deleted-project.json -w "%{http_code}" "${auth[@]}" "$BASE_URL/v1/projects/$PID")
          test "$STATUS" = "404"

          STATUS=$(curl -sS -o /tmp/file-after-project.json -w "%{http_code}" "${auth[@]}" "$BASE_URL/v1/projects/$PID/files/$FID")
          test "$STATUS" = "404"

          ME=$(curl -fsS "${auth[@]}" "$BASE_URL/v1/me")
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True; assert d["developer"]["active"] is True' <<<"$ME"

          FINAL=$(curl -fsS "${auth[@]}" "$BASE_URL/v1/credits")
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True; assert isinstance(d["credits"],int); assert d["credits"]=="'$REMAIN'"' <<<"$FINAL"

          HEALTH=$(curl -fsS "$BASE_URL/health")
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True; assert d["status"]=="online"' <<<"$HEALTH"

          V1=$(curl -fsS "$BASE_URL/v1/")
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["name"]=="4N DEV API"; assert d["version"]=="v1"' <<<"$V1"

          echo "PASS: stages 209-224"
