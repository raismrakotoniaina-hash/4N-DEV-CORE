name: Test 4N DEV Core API

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Run Core API smoke and CRUD tests
        env:
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          API: https://fourn-dev-core.onrender.com/v1
        run: |
          set -e

          request() {
            curl --fail-with-body --max-time 60 --silent --show-error \
              -H "Authorization: Bearer $CORE_API_KEY" \
              "$@"
          }

          json_check() {
            python3 - "$@" <<'PY'
          import json, sys
          path, expected_key, expected_value = sys.argv[1:4]
          with open(path) as f:
              data = json.load(f)
          assert data.get("success") is True, f"{path}: API request failed"
          if expected_key:
              assert data.get(expected_key) == json.loads(expected_value), f"{path}: unexpected {expected_key}"
          PY
          }

          echo "== 1. AUTH + STARTING CREDITS =="
          request "$API/me" > me.json
          python3 - <<'PY'
          import json
          data = json.load(open("me.json"))
          assert data["success"] is True
          assert data["developer"]["plan"] == "pro"
          assert data["developer"]["credits"] >= 29
          open("before.txt","w").write(str(data["developer"]["credits"]))
          print("AUTH OK | Plan:", data["developer"]["plan"], "| Credits:", data["developer"]["credits"])
          PY

          echo "== 2. CHAT =="
          request -X POST -H "Content-Type: application/json" \
            -d '{"input":"Say exactly: 4N DEV chat test OK"}' "$API/chat" > chat.json
          python3 - <<'PY'
          import json
          d=json.load(open("chat.json"))
          assert d["success"] and isinstance(d["output"],str)
          assert d["model"]=="4n-dev-demo-chat" and d["credits_used"]==1
          print("CHAT OK | 1 credit")
          PY

          echo "== 3. CODING =="
          request -X POST -H "Content-Type: application/json" \
            -d '{"input":"Create a JavaScript function that adds two numbers."}' "$API/coding" > coding.json
          python3 - <<'PY'
          import json
          d=json.load(open("coding.json"))
          assert d["success"] and isinstance(d["output"],str)
          assert d["model"]=="4n-dev-demo-coding" and d["credits_used"]==5
          print("CODING OK | 5 credits")
          PY

          echo "== 4. IMAGE =="
          request -X POST -H "Content-Type: application/json" \
            -d '{"prompt":"A futuristic 4N DEV technology logo","quality":"low"}' "$API/image" > image.json
          python3 - <<'PY'
          import json
          d=json.load(open("image.json"))
          assert d["success"] and d["model"]=="4n-dev-demo-image"
          assert d["credits_used"]==10
          assert d["image"]["url"].startswith("data:image/svg+xml;base64,")
          print("IMAGE OK | 10 credits")
          PY

          echo "== 5. EMBEDDINGS =="
          request -X POST -H "Content-Type: application/json" \
            -d '{"input":"4N DEV embeddings test"}' "$API/embeddings" > embeddings.json
          python3 - <<'PY'
          import json
          d=json.load(open("embeddings.json"))
          assert d["success"] and d["model"]=="4n-dev-demo-embedding"
          assert d["credits_used"]==1
          assert len(d["data"][0]["embedding"])==8
          print("EMBEDDINGS OK | 1 credit")
          PY

          echo "== 6. BUILDER PLANNER =="
          request -X POST -H "Content-Type: application/json" \
            -d '{"prompt":"Create an e-commerce app with products, cart, checkout and admin dashboard"}' "$API/builder/plan" > builder-plan.json
          python3 - <<'PY'
          import json
          d=json.load(open("builder-plan.json"))
          assert d["success"] and d["model"]=="4n-dev-demo-planner"
          assert d["credits_used"]==2
          plan=d["plan"]
          assert plan["project_type"]=="ecommerce"
          assert plan["pages"] and plan["features"] and plan["data_models"]
          assert any("product" in x.lower() for x in plan["pages"])
          assert any("cart" in x.lower() for x in plan["pages"])
          assert any("checkout" in x.lower() for x in plan["pages"])
          print("BUILDER PLANNER OK | ecommerce | 2 credits")
          PY

          echo "== 7. BUILDER =="
          request -X POST -H "Content-Type: application/json" \
            -d '{"prompt":"Create a simple 4N DEV landing page","projectName":"4N DEV Test"}' "$API/builder" > builder.json
          python3 - <<'PY'
          import json
          d=json.load(open("builder.json"))
          assert d["success"] and d["model"]=="4n-dev-demo-builder"
          assert d["credits_used"]==10 and d["files"]
          assert any(f["path"]=="index.html" and f["content"] for f in d["files"])
          open("project_id.txt","w").write(d["project"]["id"])
          print("BUILDER OK | 10 credits")
          PY

          echo "== 8. PLANNER -> BUILDER INTEGRATION =="
          python3 - <<'PY'
          import json
          plan=json.load(open("builder-plan.json"))["plan"]
          payload=json.dumps({
              "prompt":"Create an e-commerce app with products, cart, checkout and admin dashboard",
              "projectName":"Planner Builder Integration Test",
              "plan":plan
          })
          open("planner-builder-payload.json","w").write(payload)
          PY
          request -X POST -H "Content-Type: application/json" \
            -d @planner-builder-payload.json "$API/builder" > planner-builder.json
          python3 - <<'PY'
          import json
          d=json.load(open("planner-builder.json"))
          assert d["success"] and d["model"]=="4n-dev-demo-builder"
          assert d["credits_used"]==10 and d["files"]
          assert any(f["path"]=="index.html" and f["content"] for f in d["files"])
          assert "ecommerce" in d["summary"].lower()
          open("planner_builder_project_id.txt","w").write(d["project"]["id"])
          print("PLANNER -> BUILDER OK | plan accepted | 10 credits")
          PY

          PROJECT_ID=$(cat project_id.txt)

          echo "== 9. PROJECT + FILE CRUD =="
          request "$API/projects" > projects.json
          python3 - <<'PY'
          import json
          d=json.load(open("projects.json"))
          assert d["success"] and any(p["id"]==open("project_id.txt").read() for p in d["projects"])
          print("PROJECT LIST OK")
          PY

          request "$API/projects/$PROJECT_ID" > project.json
          python3 - <<'PY'
          import json
          assert json.load(open("project.json"))["success"]
          PY

          request -X PATCH -H "Content-Type: application/json" \
            -d '{"description":"Automated CRUD test"}' "$API/projects/$PROJECT_ID" > project-update.json
          python3 - <<'PY'
          import json
          assert json.load(open("project-update.json"))["project"]["description"]=="Automated CRUD test"
          print("PROJECT GET/UPDATE OK")
          PY

          request "$API/projects/$PROJECT_ID/files" > files.json
          python3 - <<'PY'
          import json
          d=json.load(open("files.json"))
          f=next(x for x in d["files"] if x["path"]=="index.html")
          open("file_id.txt","w").write(f["id"])
          print("FILE LIST OK")
          PY

          FILE_ID=$(cat file_id.txt)
          request "$API/projects/$PROJECT_ID/files/$FILE_ID" > file.json
          python3 - <<'PY'
          import json
          d=json.load(open("file.json"))
          assert d["success"] and d["file"]["content"]
          PY

          request -X POST -H "Content-Type: application/json" \
            -d '{"path":"test.txt","content":"4N DEV CRUD test"}' "$API/projects/$PROJECT_ID/files" > file-create.json
          python3 - <<'PY'
          import json
          d=json.load(open("file-create.json"))
          assert d["success"]
          open("test_file_id.txt","w").write(d["file"]["id"])
          PY

          TEST_FILE_ID=$(cat test_file_id.txt)
          request -X PUT -H "Content-Type: application/json" \
            -d '{"content":"4N DEV CRUD update OK"}' "$API/projects/$PROJECT_ID/files/$TEST_FILE_ID" > file-update.json
          python3 - <<'PY'
          import json
          assert json.load(open("file-update.json"))["file"]["content"]=="4N DEV CRUD update OK"
          PY

          request -X DELETE "$API/projects/$PROJECT_ID/files/$TEST_FILE_ID" > file-delete.json
          request -X DELETE "$API/projects/$PROJECT_ID" > project-delete.json
          python3 - <<'PY'
          import json
          assert json.load(open("file-delete.json"))["deleted"] is True
          assert json.load(open("project-delete.json"))["deleted"] is True
          print("PROJECT/FILE CRUD OK")
          PY

          echo "== 10. FINAL CREDITS =="
          request "$API/me" > after.json
          python3 - <<'PY'
          import json
          before=int(open("before.txt").read())
          after=json.load(open("after.json"))["developer"]["credits"]
          assert after==before-39, f"Expected {before-27}, got {after}"
          print("CREDITS OK | Before:", before, "| After:", after)
          print("ALL CORE API TESTS PASSED")
          PY


          echo "== 11. PAPI CHECKOUT =="
          request "$API/billing/providers" > billing-providers.json
          python3 - <<'PY'
          import json
          d=json.load(open("billing-providers.json"))
          papi=next(p for p in d["providers"] if p["id"]=="papi")
          assert papi["configured"] is True, "PAPI is not configured"
          print("PAPI PROVIDER OK | Configured:", papi["configured"])
          PY

          request -X POST -H "Content-Type: application/json"             -d '{"planId":"starter","currency":"MGA"}' "$API/billing/orders" > billing-order.json
          python3 - <<'PY'
          import json
          d=json.load(open("billing-order.json"))
          assert d["success"] is True
          assert d["order"]["planId"]=="starter"
          assert d["order"]["amount"]==45000
          open("billing_order_id.txt","w").write(d["order"]["id"])
          print("PAPI ORDER OK | Starter | 45,000 MGA")
          PY

          ORDER_ID=$(cat billing_order_id.txt)
          request -X POST -H "Content-Type: application/json"             -d '{"provider":"papi"}' "$API/billing/orders/$ORDER_ID/checkout" > billing-checkout.json
          python3 - <<'PY'
          import json
          d=json.load(open("billing-checkout.json"))
          assert d["success"] is True
          assert d["provider"]=="papi"
          assert d["payment"]["status"]=="pending"
          checkout=d["checkout"]
          payment_url=checkout.get("paymentLink")
          short_url=checkout.get("shortLink")
          url=short_url or payment_url
          assert url and url.startswith("http"), "Missing PAPI checkout URL"
          print("PAPI CHECKOUT OK")
          print("Short checkout URL:", short_url or "none")
          print("Payment URL available:", bool(payment_url))
          print("Payment ID:", d["payment"]["id"])
          PY

          echo "PAPI CHECKOUT CREATED | Use the Short checkout URL shown above."
