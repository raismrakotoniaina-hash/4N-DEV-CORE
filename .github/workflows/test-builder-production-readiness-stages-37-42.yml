name: Builder Production Readiness Stages 37-42

on:
  workflow_dispatch:

jobs:
  certification:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://fourn-dev-core.onrender.com
      API_KEY: ${{ secrets.CORE_API_KEY }}
    steps:
      - name: Stage 37 - API Key Management Security
        run: |
          set -e
          echo "Checking protected API-key management endpoint..."
          code=$(curl -sS -o /tmp/key.json -w "%{http_code}" -X POST "$BASE_URL/v1/keys"             -H "content-type: application/json"             -d '{"name":"ci-unauthorized","planId":"free"}')
          test "$code" = "503" || test "$code" = "403"
          grep -q '"success":false' /tmp/key.json
          echo "STAGE 37 PASSED"

      - name: Stage 38 - Plan and Feature Boundary
        run: |
          set -e
          test -n "$API_KEY"
          me=$(curl -fsS "$BASE_URL/v1/me" -H "Authorization: Bearer $API_KEY")
          echo "$me" | grep -q '"success":true'
          echo "$me" | grep -q '"plan"'
          echo "$me" | grep -q '"features"'
          echo "$me" | grep -q '"scopes"'
          policy=$(curl -fsS "$BASE_URL/v1/credit-policy")
          echo "$policy" | grep -q '"planner"'
          echo "$policy" | grep -q '"builder"'
          echo "STAGE 38 PASSED"

      - name: Stage 39 - Credit Exhaustion Contract
        run: |
          set -e
          # Safe contract check: an invalid project must fail before any credit spend.
          before=$(curl -fsS "$BASE_URL/v1/credits" -H "Authorization: Bearer $API_KEY")
          before_credits=$(echo "$before" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          code=$(curl -sS -o /tmp/exhaust.json -w "%{http_code}" -X POST "$BASE_URL/v1/builder"             -H "Authorization: Bearer $API_KEY"             -H "content-type: application/json"             -d '{"prompt":"safe credit boundary check","projectId":"00000000-0000-0000-0000-000000000000"}')
          test "$code" = "404"
          after=$(curl -fsS "$BASE_URL/v1/credits" -H "Authorization: Bearer $API_KEY")
          after_credits=$(echo "$after" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          test "$before_credits" = "$after_credits"
          echo "STAGE 39 PASSED"

      - name: Stage 40 - Rate Limit Protection
        run: |
          set -e
          hit_429=0
          for i in $(seq 1 70); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/v1/credit-policy")
            if [ "$code" = "429" ]; then hit_429=1; break; fi
          done
          test "$hit_429" = "1"
          sleep 61
          echo "STAGE 40 PASSED"

      - name: Stage 41 - Error Response Standardization
        run: |
          set -e
          code=$(curl -sS -o /tmp/error.json -w "%{http_code}"             -H "Authorization: Bearer $API_KEY"             -H "content-type: application/json"             -X POST "$BASE_URL/v1/builder"             -d '{"prompt":""}')
          test "$code" = "400"
          grep -q '"success":false' /tmp/error.json
          grep -q '"error":"prompt is required"' /tmp/error.json
          echo "STAGE 41 PASSED"

      - name: Stage 42 - Final Production Certification
        run: |
          set -e
          health=$(curl -fsS "$BASE_URL/health")
          echo "$health" | grep -q '"status":"online"'
          me=$(curl -fsS "$BASE_URL/v1/me" -H "Authorization: Bearer $API_KEY")
          echo "$me" | grep -q '"active":true'
          echo "BUILDER PRODUCTION READINESS STAGES 37-42 PASSED"
