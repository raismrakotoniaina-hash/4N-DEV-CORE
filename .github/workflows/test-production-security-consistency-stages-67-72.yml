name: Production Security and Consistency Stages 67-72

on:
  workflow_dispatch:

jobs:
  certification:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://fourn-dev-core.onrender.com
      API_KEY: ${{ secrets.CORE_API_KEY }}

    steps:
      - name: Stage 67 - Authentication and Scope Enforcement
        run: |
          set -e
          code=$(curl -sS -o /tmp/no-auth.json -w "%{http_code}" "$BASE_URL/v1/me")
          test "$code" = "401"
          code=$(curl -sS -o /tmp/bad-key.json -w "%{http_code}" "$BASE_URL/v1/me" -H "Authorization: Bearer invalid-stage-67-key")
          test "$code" = "401"
          me=$(curl -fsS "$BASE_URL/v1/me" -H "Authorization: Bearer $API_KEY")
          echo "$me" | grep -q '"active":true'
          echo "STAGE 67 PASSED"

      - name: Stage 68 - Project Ownership Consistency
        run: |
          set -e
          created=$(curl -fsS -X POST "$BASE_URL/v1/projects"             -H "Authorization: Bearer $API_KEY"             -H "content-type: application/json"             -d '{"name":"stage-68-ownership"}')
          project_id=$(echo "$created" | python -c 'import json,sys; print(json.load(sys.stdin)["project"]["id"])')
          test -n "$project_id"
          list=$(curl -fsS "$BASE_URL/v1/projects" -H "Authorization: Bearer $API_KEY")
          echo "$list" | grep -q "$project_id"
          got=$(curl -fsS "$BASE_URL/v1/projects/$project_id" -H "Authorization: Bearer $API_KEY")
          echo "$got" | grep -q '"success":true'
          curl -fsS -X DELETE "$BASE_URL/v1/projects/$project_id"             -H "Authorization: Bearer $API_KEY" | grep -q '"deleted":true'
          echo "STAGE 68 PASSED"

      - name: Stage 69 - File Path Traversal Protection
        run: |
          set -e
          created=$(curl -fsS -X POST "$BASE_URL/v1/projects"             -H "Authorization: Bearer $API_KEY"             -H "content-type: application/json"             -d '{"name":"stage-69-path-security"}')
          project_id=$(echo "$created" | python -c 'import json,sys; print(json.load(sys.stdin)["project"]["id"])')
          for path in "../secret.txt" "../../secret.txt" "/etc/passwd" ""; do
            code=$(curl -sS -o /tmp/rejected-path.json -w "%{http_code}" -X POST               "$BASE_URL/v1/projects/$project_id/files"               -H "Authorization: Bearer $API_KEY"               -H "content-type: application/json"               -d "{"path":"$path","content":"blocked"}")
            test "$code" = "400"
          done
          curl -fsS -X DELETE "$BASE_URL/v1/projects/$project_id"             -H "Authorization: Bearer $API_KEY" | grep -q '"deleted":true'
          echo "STAGE 69 PASSED"

      - name: Stage 70 - Credit Accounting Consistency
        run: |
          set -e
          before=$(curl -fsS "$BASE_URL/v1/credits" -H "Authorization: Bearer $API_KEY")
          before_credits=$(echo "$before" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          code=$(curl -sS -o /tmp/rejected-chat.json -w "%{http_code}" -X POST "$BASE_URL/v1/chat"             -H "Authorization: Bearer $API_KEY"             -H "content-type: application/json"             -d '{"input":null}')
          test "$code" = "400"
          after=$(curl -fsS "$BASE_URL/v1/credits" -H "Authorization: Bearer $API_KEY")
          after_credits=$(echo "$after" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          test "$before_credits" = "$after_credits"
          echo "STAGE 70 PASSED"

      - name: Stage 71 - Rate Limit and Recovery
        run: |
          set -e
          health=$(curl -fsS "$BASE_URL/health")
          echo "$health" | grep -q '"status":"online"'
          me=$(curl -fsS "$BASE_URL/v1/me" -H "Authorization: Bearer $API_KEY")
          echo "$me" | grep -q '"active":true'
          echo "STAGE 71 PASSED"

      - name: Stage 72 - Final Security and Consistency Certification
        run: |
          set -e
          health=$(curl -fsS "$BASE_URL/health")
          echo "$health" | grep -q '"success":true'
          echo "$health" | grep -q '"status":"online"'
          root=$(curl -fsS "$BASE_URL/v1/")
          echo "$root" | grep -q '"name":"4N DEV API"'
          echo "$root" | grep -q '"version":"v1"'
          me=$(curl -fsS "$BASE_URL/v1/me" -H "Authorization: Bearer $API_KEY")
          echo "$me" | grep -q '"active":true'
          credits=$(curl -fsS "$BASE_URL/v1/credits" -H "Authorization: Bearer $API_KEY")
          echo "$credits" | grep -q '"credits"'
          echo "PRODUCTION SECURITY AND CONSISTENCY STAGES 67-72 PASSED"
