name: Builder Platform Comprehensive Validation Stages 25-30

on:
  workflow_dispatch:

jobs:
  comprehensive:
    runs-on: ubuntu-latest
    steps:
      - name: Run Builder platform validation stages 25-30
        env:
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
        run: |
          set -euo pipefail

          BASE="https://fourn-dev-core.onrender.com"
          API="$BASE/v1"
          AUTH=(-H "Authorization: Bearer $CORE_API_KEY" -H "Content-Type: application/json")

          echo "===== STAGE 25: PLATFORM HEALTH & PUBLIC CONTRACT ====="
          HEALTH=$(curl -fsS "$BASE/health")
          test "$(echo "$HEALTH" | jq -r '.success')" = "true"
          test "$(echo "$HEALTH" | jq -r '.status')" = "online"
          POLICY=$(curl -fsS "$API/credit-policy")
          test "$(echo "$POLICY" | jq -r '.success')" = "true"
          test "$(echo "$POLICY" | jq -r '.policy.builder.credits')" -gt 0
          echo "STAGE 25 PASSED: HEALTH + PUBLIC POLICY"

          echo "===== STAGE 26: AUTH + PLAN FEATURE BOUNDARY ====="
          CODE=$(curl -sS -o /tmp/noauth.json -w "%{http_code}" -X GET "$API/credits")
          test "$CODE" = "401"
          VALID=$(curl -fsS "${AUTH[@]}" "$API/credits")
          test "$(echo "$VALID" | jq -r '.success')" = "true"
          CODE=$(curl -sS -o /tmp/bad-auth.json -w "%{http_code}" -H "Authorization: Basic $CORE_API_KEY" "$API/projects")
          test "$CODE" = "401"
          echo "STAGE 26 PASSED: AUTH BOUNDARY"

          echo "===== STAGE 27: REVIEW QUALITY DETECTION ====="
          MISSING=$(jq -n '{files:[{path:"app.js",content:"console.log(\"test\");"}]}')
          CODE=$(curl -sS -o /tmp/missing.json -w "%{http_code}" "${AUTH[@]}" -X POST "$API/builder/review" -d "$MISSING")
          test "$CODE" = "200"
          test "$(jq -r '.success' /tmp/missing.json)" = "false"
          test "$(jq -r '.review.issues[0]' /tmp/missing.json)" = "Missing index.html entry point"

          SECRET=$(jq -n '{files:[{path:"index.html",content:"<html><body>test</body></html>"},{path:"app.js",content:"const OPENAI_API_KEY=\"sk-test-secret-value-123456789012345\";"}]}')
          CODE=$(curl -sS -o /tmp/secret.json -w "%{http_code}" "${AUTH[@]}" -X POST "$API/builder/review" -d "$SECRET")
          test "$CODE" = "200"
          test "$(jq -r '.success' /tmp/secret.json)" = "false"
          test "$(jq -r '.review.checks.no_embedded_secrets' /tmp/secret.json)" = "false"
          echo "STAGE 27 PASSED: REVIEW QUALITY + SECRET DETECTION"

          echo "===== STAGE 28: PROJECT/FILE EDGE CONTRACT ====="
          CODE=$(curl -sS -o /tmp/no-project.json -w "%{http_code}" "${AUTH[@]}" "$API/projects/00000000-0000-0000-0000-000000000000")
          test "$CODE" = "404"
          CODE=$(curl -sS -o /tmp/no-files.json -w "%{http_code}" "${AUTH[@]}" "$API/projects/00000000-0000-0000-0000-000000000000/files")
          test "$CODE" = "404"
          echo "STAGE 28 PASSED: PROJECT/FILE EDGE CASES"

          echo "===== STAGE 29: PLANNER RESPONSE CONSISTENCY ====="
          PLAN=$(curl -fsS "${AUTH[@]}" -X POST "$API/builder/plan" -d '{"prompt":"Create a booking management application"}')
          test "$(echo "$PLAN" | jq -r '.success')" = "true"
          for field in project_type goal stack pages features data_models files next_step; do
            test "$(echo "$PLAN" | jq -r --arg f "$field" '.plan[$f] | type')" != "null"
          done
          test "$(echo "$PLAN" | jq -r '.credits_used')" -gt 0
          echo "STAGE 29 PASSED: PLANNER RESPONSE CONSISTENCY"

          echo "===== STAGE 30: FINAL PRODUCTION BUILDER E2E ====="
          BEFORE=$(curl -fsS "${AUTH[@]}" "$API/credits" | jq -r '.credits')
          BUILD=$(curl -fsS "${AUTH[@]}" -X POST "$API/builder" -d '{"prompt":"Create a compact production smoke-test website","projectName":"Stage 30 Production Smoke"}')
          test "$(echo "$BUILD" | jq -r '.success')" = "true"
          PROJECT_ID=$(echo "$BUILD" | jq -r '.project.id')
          test -n "$PROJECT_ID"
          test "$(echo "$BUILD" | jq -r '.files | length')" -ge 1
          test "$(echo "$BUILD" | jq -r '.review.passed')" = "true"
          USED=$(echo "$BUILD" | jq -r '.credits_used')
          AFTER=$(curl -fsS "${AUTH[@]}" "$API/credits" | jq -r '.credits')
          test "$AFTER" -eq "$((BEFORE - USED))"

          PROJECT=$(curl -fsS "${AUTH[@]}" "$API/projects/$PROJECT_ID")
          test "$(echo "$PROJECT" | jq -r '.success')" = "true"
          FILES=$(curl -fsS "${AUTH[@]}" "$API/projects/$PROJECT_ID/files")
          test "$(echo "$FILES" | jq -r '.success')" = "true"
          test "$(echo "$FILES" | jq '.files | length')" -ge 1

          DELETE_CODE=$(curl -sS -o /tmp/stage30-delete.json -w "%{http_code}" "${AUTH[@]}" -X DELETE "$API/projects/$PROJECT_ID")
          test "$DELETE_CODE" = "200"
          VERIFY_CODE=$(curl -sS -o /tmp/stage30-verify.json -w "%{http_code}" "${AUTH[@]}" "$API/projects/$PROJECT_ID")
          test "$VERIFY_CODE" = "404"
          echo "STAGE 30 PASSED: PRODUCTION BUILDER E2E"

          echo "=============================================="
          echo "BUILDER PLATFORM STAGES 25-30 PASSED"
          echo "=============================================="
