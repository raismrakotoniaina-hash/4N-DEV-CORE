name: Test Production Contract Stages 91-108

on:
  workflow_dispatch:

jobs:
  production-contract-91-108:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://fourn-dev-core.onrender.com
      API_KEY: ${{ secrets.CORE_API_KEY }}

    steps:
      - name: Stages 91-94 Public plans and API contract
        run: |
          set -e
          BASE="$BASE_URL"
          PLANS=$(curl -fsS "$BASE/v1/plans")
          echo "$PLANS" | grep -q '"success":true'
          echo "$PLANS" | grep -q '"free"'
          echo "$PLANS" | grep -q '"starter"'
          echo "$PLANS" | grep -q '"pro"'
          CODE=$(curl -sS -o /tmp/plan-missing.json -w "%{http_code}" "$BASE/v1/plans/not-a-real-plan")
          test "$CODE" = "404"
          ROOT=$(curl -fsS "$BASE/v1/")
          echo "$ROOT" | grep -q '"name":"4N DEV API"'
          echo "$ROOT" | grep -q '"version":"v1"'
          echo "Stages 91-94 passed"

      - name: Stages 95-98 Authenticated account and credits contract
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          ME=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/me")
          echo "$ME" | grep -q '"active":true'
          echo "$ME" | grep -q '"plan"'
          echo "$ME" | grep -q '"features"'
          echo "$ME" | grep -q '"scopes"'
          CREDITS=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits")
          echo "$CREDITS" | grep -q '"success":true'
          echo "$CREDITS" | grep -Eq '"credits":[0-9]+'
          CODE=$(curl -sS -o /tmp/no-auth-credits.json -w "%{http_code}" "$BASE/v1/credits")
          test "$CODE" = "401"
          CODE=$(curl -sS -o /tmp/no-auth-projects.json -w "%{http_code}" "$BASE/v1/projects")
          test "$CODE" = "401"
          echo "Stages 95-98 passed"

      - name: Stages 99-102 Validation and feature boundary
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          CODE=$(curl -sS -o /tmp/chat-invalid.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/chat" -d '{"input":123}')
          test "$CODE" = "400"
          CODE=$(curl -sS -o /tmp/coding-invalid.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/coding" -d '{"input":123}')
          test "$CODE" = "400"
          CODE=$(curl -sS -o /tmp/image-invalid.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/image" -d '{"prompt":""}')
          test "$CODE" = "400"
          CODE=$(curl -sS -o /tmp/image-quality-invalid.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/image" -d '{"prompt":"stage-102","quality":"invalid"}')
          test "$CODE" = "400"
          echo "Stages 99-102 passed"

      - name: Stages 103-106 Project and file contract
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          P=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/projects")
          echo "$P" | grep -q '"success":true'
          CREATED=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects" -d '{"name":"stage-103-contract"}')
          PID=$(echo "$CREATED" | python -c 'import json,sys; print(json.load(sys.stdin)["project"]["id"])')
          test -n "$PID"
          FILE=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects/$PID/files" -d '{"path":"contract.txt","content":"stage-103"}')
          FID=$(echo "$FILE" | python -c 'import json,sys; print(json.load(sys.stdin)["file"]["id"])')
          test -n "$FID"
          LIST=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/projects/$PID/files")
          echo "$LIST" | grep -q "$FID"
          CODE=$(curl -sS -o /tmp/bad-file.json -w "%{http_code}" -H "Authorization: Bearer $KEY" "$BASE/v1/projects/$PID/files/not-a-real-file")
          test "$CODE" = "404"
          curl -fsS -H "Authorization: Bearer $KEY" -X DELETE "$BASE/v1/projects/$PID/files/$FID" | grep -q '"deleted":true'
          curl -fsS -H "Authorization: Bearer $KEY" -X DELETE "$BASE/v1/projects/$PID" | grep -q '"deleted":true'
          echo "Stages 103-106 passed"

      - name: Stages 107-108 Final resilience certification
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          for i in 107 108; do
            curl -fsS "$BASE/health" | grep -q '"status":"online"'
            curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/me" | grep -q '"active":true'
            curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits" | grep -q '"credits"'
            echo "Stage $i passed"
          done
          echo "PRODUCTION CONTRACT STAGES 91-108 PASSED"
