name: Builder Platform Certification Stages 31-36

on:
  workflow_dispatch:

jobs:
  certification:
    runs-on: ubuntu-latest
    steps:
      - name: Production platform certification 31-36
        env:
          BASE_URL: https://fourn-dev-core.onrender.com
          API_KEY: ${{ secrets.CORE_API_KEY }}
        run: |
          set -euo pipefail
          echo "=== Stage 31: Public Production Contracts ==="
          health=$(curl -fsS "$BASE_URL/health")
          echo "$health" | grep -q '"success":true'
          echo "$health" | grep -q '"status":"online"'
          plans=$(curl -fsS "$BASE_URL/v1/plans")
          echo "$plans" | grep -q '"success":true'
          echo "$plans" | grep -q '"id":"free"'
          echo "$plans" | grep -q '"id":"pro"'
          policy=$(curl -fsS "$BASE_URL/v1/credit-policy")
          echo "$policy" | grep -q '"success":true'
          echo "$policy" | grep -q '"builder"'
          echo "$policy" | grep -q '"planner"'
          echo "STAGE 31 PASSED"

          echo "=== Stage 32: Authentication Boundary ==="
          code=$(curl -sS -o /tmp/no-auth.json -w "%{http_code}" "$BASE_URL/v1/credits")
          test "$code" = "401"
          code=$(curl -sS -o /tmp/bad-auth.json -w "%{http_code}" -H "Authorization: Bearer invalid-key" "$BASE_URL/v1/credits")
          test "$code" = "401"
          credits=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$BASE_URL/v1/credits")
          echo "$credits" | grep -q '"success":true'
          echo "$credits" | grep -q '"credits":'
          echo "STAGE 32 PASSED"

          echo "=== Stage 33: Review + Security Matrix ==="
          review=$(curl -fsS -X POST "$BASE_URL/v1/builder/review" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d '{"files":[{"path":"index.html","content":"<html><head></head><body>Hello</body></html>"},{"path":"app.js","content":"console.log(\"ok\")"}]}')
          echo "$review" | grep -q '"success":'
          echo "$review" | grep -q '"passed":'
          secret=$(curl -fsS -X POST "$BASE_URL/v1/builder/review" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d '{"files":[{"path":"index.html","content":"<html><body>ok</body></html>"},{"path":"config.js","content":"const key = \"4ndev_sk_live_fake\";"}]}')
          echo "$secret" | grep -q '"passed":false'
          echo "$secret" | grep -q 'secret'
          traversal=$(curl -fsS -X POST "$BASE_URL/v1/builder/review" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d '{"files":[{"path":"../secret.txt","content":"blocked"},{"path":"/etc/passwd","content":"blocked"},{"path":"index.html","content":"<html><body>safe</body></html>"}]}')
          echo "$traversal" | grep -q '"success":true'
          echo "STAGE 33 PASSED"

          echo "=== Stage 34: Project + File Contract ==="
          project=$(curl -fsS -X POST "$BASE_URL/v1/projects" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d '{"name":"stage-34-certification","description":"platform certification"}')
          project_id=$(echo "$project" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          test -n "$project_id"
          file=$(curl -fsS -X POST "$BASE_URL/v1/projects/$project_id/files" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d '{"path":"index.html","content":"<html><body>Stage 34</body></html>"}')
          echo "$file" | grep -q '"success":true'
          listed=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$BASE_URL/v1/projects/$project_id/files")
          echo "$listed" | grep -q 'index.html'
          updated=$(curl -fsS -X PUT "$BASE_URL/v1/projects/$project_id/files/index.html" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d '{"content":"<html><body>Stage 34 updated</body></html>"}')
          echo "$updated" | grep -q '"success":true'
          readback=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$BASE_URL/v1/projects/$project_id/files/index.html")
          echo "$readback" | grep -q 'Stage 34 updated'
          deleted_file=$(curl -fsS -X DELETE "$BASE_URL/v1/projects/$project_id/files/index.html" -H "Authorization: Bearer $API_KEY")
          echo "$deleted_file" | grep -q '"success":true'
          deleted_project=$(curl -fsS -X DELETE "$BASE_URL/v1/projects/$project_id" -H "Authorization: Bearer $API_KEY")
          echo "$deleted_project" | grep -q '"success":true'
          echo "STAGE 34 PASSED"

          echo "=== Stage 35: Planner + Builder Final Integration ==="
          before=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$BASE_URL/v1/credits")
          before_credits=$(echo "$before" | sed -n 's/.*"credits":\([0-9]*\).*/\1/p')
          test -n "$before_credits"
          planner=$(curl -fsS -X POST "$BASE_URL/v1/builder/plan" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d '{"prompt":"Create a small business dashboard with customer metrics"}')
          echo "$planner" | grep -q '"success":true'
          echo "$planner" | grep -q '"project_type":"dashboard"'
          builder=$(curl -fsS -X POST "$BASE_URL/v1/builder" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d '{"prompt":"Create a small business dashboard with customer metrics","projectName":"stage-35-final"}')
          echo "$builder" | grep -q '"success":true'
          echo "$builder" | grep -q '"project"'
          echo "$builder" | grep -q '"files"'
          stage35_project_id=$(echo "$builder" | sed -n 's/.*"project":{"id":"\([^"]*\)".*/\1/p')
          test -n "$stage35_project_id"
          final_files=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$BASE_URL/v1/projects/$stage35_project_id/files")
          echo "$final_files" | grep -q 'index.html'
          echo "$final_files" | grep -q 'styles.css'
          echo "$final_files" | grep -q 'app.js'
          echo "STAGE 35 PASSED"

          echo "=== Stage 36: Final Production Regression + Cleanup ==="
          final_project=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$BASE_URL/v1/projects/$stage35_project_id")
          echo "$final_project" | grep -q '"success":true'
          echo "$final_project" | grep -q 'stage-35-final'
          final_review=$(curl -fsS -X POST "$BASE_URL/v1/builder/review" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d '{"files":[{"path":"index.html","content":"<html><head><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"></head><body>Final</body></html>"},{"path":"styles.css","content":"body{margin:0}"}]}')
          echo "$final_review" | grep -q '"success":true'
          cleanup=$(curl -fsS -X DELETE "$BASE_URL/v1/projects/$stage35_project_id" -H "Authorization: Bearer $API_KEY")
          echo "$cleanup" | grep -q '"success":true'
          missing=$(curl -sS -o /tmp/missing-project.json -w "%{http_code}" -H "Authorization: Bearer $API_KEY" "$BASE_URL/v1/projects/$stage35_project_id")
          test "$missing" = "404"
          after=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$BASE_URL/v1/credits")
          after_credits=$(echo "$after" | sed -n 's/.*"credits":\([0-9]*\).*/\1/p')
          test -n "$after_credits"
          test "$after_credits" -lt "$before_credits"
          echo "STAGE 36 PASSED"
          echo "BUILDER PLATFORM STAGES 31-36 PASSED"
