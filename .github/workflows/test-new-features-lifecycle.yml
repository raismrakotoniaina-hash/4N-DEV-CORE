name: Test New Features Lifecycle

on:
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Test API key deactivation
        env:
          BASE_URL: https://fourn-dev-core.onrender.com
          ADMIN_SECRET: ${{ secrets.CORE_ADMIN_SECRET }}
        run: |
          set -euo pipefail

          KEY_RESPONSE=$(curl -fsS -X POST "$BASE_URL/v1/keys"             -H "Content-Type: application/json"             -H "x-core-admin-secret: $ADMIN_SECRET"             -d '{"name":"new-features-lifecycle-test","planId":"free","scopes":["chat"]}')

          TEST_KEY=$(python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True; print(d["api_key"])' <<<"$KEY_RESPONSE")
          TEST_KEY_ID=$(python -c 'import json,sys; d=json.load(sys.stdin); print(d["id"])' <<<"$KEY_RESPONSE")

          ME=$(curl -fsS -H "Authorization: Bearer $TEST_KEY" "$BASE_URL/v1/me")
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True; assert d["developer"]["active"] is True' <<<"$ME"

          BAD_TYPE=$(curl -sS -o /tmp/bad-type.json -w "%{http_code}" -X PATCH "$BASE_URL/v1/keys/$TEST_KEY_ID"             -H "Authorization: Bearer $TEST_KEY"             -H "Content-Type: application/json"             -d '{"active":"false"}')
          test "$BAD_TYPE" = "400"

          DEACTIVATE=$(curl -fsS -X PATCH "$BASE_URL/v1/keys/$TEST_KEY_ID"             -H "Authorization: Bearer $TEST_KEY"             -H "Content-Type: application/json"             -d '{"active":false}')
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True; assert d["key"]["active"] is False' <<<"$DEACTIVATE"

          STATUS=$(curl -sS -o /tmp/deactivated.json -w "%{http_code}"             -H "Authorization: Bearer $TEST_KEY" "$BASE_URL/v1/me")
          test "$STATUS" = "401"

          echo "API key deactivation lifecycle passed."

      - name: Test order cancellation
        env:
          BASE_URL: https://fourn-dev-core.onrender.com
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
        run: |
          set -euo pipefail

          BEFORE=$(curl -fsS -H "Authorization: Bearer $CORE_API_KEY" "$BASE_URL/v1/credits")
          BEFORE_CREDITS=$(python -c 'import json,sys; print(json.load(sys.stdin)["credits"])' <<<"$BEFORE")

          ORDER_RESPONSE=$(curl -fsS -X POST "$BASE_URL/v1/billing/orders"             -H "Authorization: Bearer $CORE_API_KEY"             -H "Content-Type: application/json"             -d '{"planId":"starter","currency":"MGA"}')

          ORDER_ID=$(python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True; assert d["order"]["status"]=="pending"; print(d["order"]["id"])' <<<"$ORDER_RESPONSE")

          CANCEL=$(curl -fsS -X PATCH "$BASE_URL/v1/billing/orders/$ORDER_ID"             -H "Authorization: Bearer $CORE_API_KEY"             -H "Content-Type: application/json"             -d '{"action":"cancel"}')
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True; assert d["order"]["status"]=="cancelled"' <<<"$CANCEL"

          REPEAT_STATUS=$(curl -sS -o /tmp/repeat-cancel.json -w "%{http_code}" -X PATCH "$BASE_URL/v1/billing/orders/$ORDER_ID"             -H "Authorization: Bearer $CORE_API_KEY"             -H "Content-Type: application/json"             -d '{"action":"cancel"}')
          test "$REPEAT_STATUS" = "400"

          AFTER=$(curl -fsS -H "Authorization: Bearer $CORE_API_KEY" "$BASE_URL/v1/credits")
          AFTER_CREDITS=$(python -c 'import json,sys; print(json.load(sys.stdin)["credits"])' <<<"$AFTER")
          test "$BEFORE_CREDITS" = "$AFTER_CREDITS"

          echo "Order cancellation lifecycle passed."
