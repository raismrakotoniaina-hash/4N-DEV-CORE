name: Developer API Certification Stages 43-48

on:
  workflow_dispatch:

jobs:
  certification:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://fourn-dev-core.onrender.com
      API_KEY: ${{ secrets.CORE_API_KEY }}
    steps:
      - name: Stage 43 - API Key Lifecycle Contract
        run: |
          set -e
          code=$(curl -sS -o /tmp/key.json -w "%{http_code}" -X POST "$BASE_URL/v1/keys"             -H "content-type: application/json"             -d '{"name":"ci-lifecycle-check","planId":"free"}')
          test "$code" = "403" || test "$code" = "503"
          grep -q '"success":false' /tmp/key.json
          me=$(curl -fsS "$BASE_URL/v1/me" -H "Authorization: Bearer $API_KEY")
          echo "$me" | grep -q '"active":true'
          echo "STAGE 43 PASSED"

      - name: Stage 44 - Scope Enforcement Contract
        run: |
          set -e
          code=$(curl -sS -o /tmp/scope.json -w "%{http_code}"             -H "Authorization: Bearer $API_KEY"             -H "content-type: application/json"             -X POST "$BASE_URL/v1/chat"             -d '{"input":"scope certification"}')
          test "$code" = "200"
          grep -q '"success":true' /tmp/scope.json
          echo "STAGE 44 PASSED"

      - name: Stage 45 - Plan Enforcement Contract
        run: |
          set -e
          me=$(curl -fsS "$BASE_URL/v1/me" -H "Authorization: Bearer $API_KEY")
          plan=$(echo "$me" | python -c 'import json,sys; print(json.load(sys.stdin)["developer"]["plan"])')
          features=$(echo "$me" | python -c 'import json,sys; print(" ".join(json.load(sys.stdin)["developer"]["features"]))')
          test -n "$plan"
          test -n "$features"
          if echo "$features" | grep -q "coding"; then
            code=$(curl -sS -o /tmp/plan.json -w "%{http_code}"               -H "Authorization: Bearer $API_KEY" -H "content-type: application/json"               -X POST "$BASE_URL/v1/coding" -d '{"input":"return 1"}')
            test "$code" = "200" || test "$code" = "402"
          fi
          echo "STAGE 45 PASSED"

      - name: Stage 46 - Credit Transaction Integrity
        run: |
          set -e
          before=$(curl -fsS "$BASE_URL/v1/credits" -H "Authorization: Bearer $API_KEY")
          before_credits=$(echo "$before" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          code=$(curl -sS -o /tmp/bad.json -w "%{http_code}"             -H "Authorization: Bearer $API_KEY" -H "content-type: application/json"             -X POST "$BASE_URL/v1/chat" -d '{"input":null}')
          test "$code" = "400"
          after=$(curl -fsS "$BASE_URL/v1/credits" -H "Authorization: Bearer $API_KEY")
          after_credits=$(echo "$after" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          test "$before_credits" = "$after_credits"
          echo "STAGE 46 PASSED"

      - name: Stage 47 - Security and Abuse Regression
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}"               -H "Authorization: Bearer invalid-key-$i" "$BASE_URL/v1/me")
            test "$code" = "401"
          done
          code=$(curl -sS -o /tmp/traversal.json -w "%{http_code}"             -H "Authorization: Bearer $API_KEY" -H "content-type: application/json"             -X POST "$BASE_URL/v1/builder/review"             -d '{"files":[{"path":"../../secret.txt","content":"x"}]}')
          test "$code" = "400"
          echo "STAGE 47 PASSED"

      - name: Stage 48 - Final Developer API Certification
        run: |
          set -e
          health=$(curl -fsS "$BASE_URL/health")
          echo "$health" | grep -q '"status":"online"'
          policy=$(curl -fsS "$BASE_URL/v1/credit-policy")
          echo "$policy" | grep -q '"chat"'
          echo "$policy" | grep -q '"coding"'
          echo "$policy" | grep -q '"builder"'
          me=$(curl -fsS "$BASE_URL/v1/me" -H "Authorization: Bearer $API_KEY")
          echo "$me" | grep -q '"active":true'
          echo "DEVELOPER API STAGES 43-48 PASSED"
