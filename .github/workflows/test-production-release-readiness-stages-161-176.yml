name: Production Release Readiness 161-176

on:
  workflow_dispatch:

jobs:
  production-release-readiness-161-176:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://fourn-dev-core.onrender.com
      API_KEY: ${{ secrets.CORE_API_KEY }}

    steps:
      - name: Stages 161-164 Production API and account readiness
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          HEALTH=$(curl -fsS "$BASE/health")
          echo "$HEALTH" | grep -q '"status":"online"'
          ROOT=$(curl -fsS "$BASE/v1/")
          echo "$ROOT" | grep -q '"name":"4N DEV API"'
          echo "$ROOT" | grep -q '"version":"v1"'
          ME=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/me")
          echo "$ME" | grep -q '"active":true'
          echo "$ME" | grep -q '"plan":"pro"'
          CREDITS=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits")
          echo "$CREDITS" | grep -q '"credits"'
          echo "Stages 161-164 passed"

      - name: Stages 165-168 Chat and coding production readiness
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          BEFORE=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits")
          B=$(echo "$BEFORE" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          CHAT=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/chat" -d '{"input":"Production readiness check"}')
          echo "$CHAT" | grep -q '"success":true'
          echo "$CHAT" | grep -q '"output"'
          echo "$CHAT" | grep -q '"credits_used":1'
          AFTER_CHAT=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits")
          C=$(echo "$AFTER_CHAT" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          test "$C" = "$((B-1))"
          CODE=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/coding" -d '{"input":"Return a minimal JavaScript hello-world example"}')
          echo "$CODE" | grep -q '"success":true'
          echo "$CODE" | grep -q '"output"'
          echo "$CODE" | grep -q '"credits_used":5'
          AFTER_CODE=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits")
          D=$(echo "$AFTER_CODE" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          test "$D" = "$((C-5))"
          echo "Stages 165-168 passed"

      - name: Stages 169-172 Embeddings and image production readiness
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          BEFORE=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits")
          B=$(echo "$BEFORE" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          EMB=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/embeddings" -d '{"input":"4N DEV production readiness"}')
          echo "$EMB" | grep -q '"success":true'
          echo "$EMB" | grep -q '"data"'
          echo "$EMB" | grep -q '"credits_used":1'
          IMG=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/image" -d '{"prompt":"simple production readiness icon","quality":"low"}')
          echo "$IMG" | grep -q '"success":true'
          echo "$IMG" | grep -q '"image"'
          echo "$IMG" | grep -q '"credits_used":10'
          AFTER=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/credits")
          A=$(echo "$AFTER" | python -c 'import json,sys; print(json.load(sys.stdin)["credits"])')
          test "$A" = "$((B-11))"
          echo "Stages 169-172 passed"

      - name: Stages 173-176 Project-file integration and security readiness
        run: |
          set -e
          BASE="$BASE_URL"
          KEY="$API_KEY"
          PROJECT=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects" -d '{"name":"release-readiness-project","description":"production-release"}')
          PID=$(echo "$PROJECT" | python -c 'import json,sys; print(json.load(sys.stdin)["project"]["id"])')
          FILE=$(curl -fsS -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects/$PID/files" -d '{"path":"index.html","content":"<html><body>release-ready</body></html>"}')
          FID=$(echo "$FILE" | python -c 'import json,sys; print(json.load(sys.stdin)["file"]["id"])')
          GET=$(curl -fsS -H "Authorization: Bearer $KEY" "$BASE/v1/projects/$PID/files/$FID")
          echo "$GET" | grep -q '"content":"<html><body>release-ready</body></html>"'
          CODE=$(curl -sS -o /tmp/release-noauth.json -w "%{http_code}" "$BASE/v1/me")
          test "$CODE" = "401"
          CODE=$(curl -sS -o /tmp/release-badpath.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -X POST "$BASE/v1/projects/$PID/files" -d '{"path":"../blocked","content":"x"}')
          test "$CODE" = "400"
          CODE=$(curl -sS -o /tmp/release-delete-file.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -X DELETE "$BASE/v1/projects/$PID/files/$FID")
          test "$CODE" = "200"
          CODE=$(curl -sS -o /tmp/release-delete-project.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -X DELETE "$BASE/v1/projects/$PID")
          test "$CODE" = "200"
          CODE=$(curl -sS -o /tmp/release-missing-project.json -w "%{http_code}" -H "Authorization: Bearer $KEY" "$BASE/v1/projects/$PID")
          test "$CODE" = "404"
          echo "PRODUCTION RELEASE READINESS STAGES 161-176 PASSED"
