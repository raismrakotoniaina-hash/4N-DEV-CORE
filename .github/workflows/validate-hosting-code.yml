name: Validate hosting infrastructure code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          set -eu
          find server -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check frontend/app.js

      - name: Check shell script syntax
        run: |
          set -eu
          for file in scripts/*.sh; do
            sh -n "$file"
          done

      - name: Prepare non-secret environment for Compose validation
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Core Docker image
        run: docker build --tag 4n-dev-core:ci .
