name: Test Builder Credit Usage Isolation

on:
  workflow_dispatch: {}

jobs:
  credit-usage-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        env:
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          API: https://fourn-dev-core.onrender.com/v1
        run: |
          set -euo pipefail
          test -n "$CORE_API_KEY"
          echo "CORE_API_KEY=$CORE_API_KEY" >> "$GITHUB_ENV"
          echo "API=$API" >> "$GITHUB_ENV"

      - name: Read credit policy
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 60 --silent --show-error             -H "Authorization: Bearer $CORE_API_KEY"             "$API/credit-policy" > policy.json
          cat policy.json
          python3 - <<'PY'
          import json
          d=json.load(open("policy.json"))
          assert d["success"] is True
          assert d["policy"]["planner"]["credits"] == 2
          assert d["policy"]["builder"]["credits"] == 10
          print("CREDIT POLICY READ OK")
          print("PLANNER COST:", d["policy"]["planner"]["credits"])
          print("BUILDER COST:", d["policy"]["builder"]["credits"])
          PY

      - name: Read starting balance
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 60 --silent --show-error             -H "Authorization: Bearer $CORE_API_KEY"             "$API/credits" > before.json
          cat before.json
          python3 - <<'PY'
          import json
          d=json.load(open("before.json"))
          assert d["success"] is True
          assert isinstance(d["credits"], (int,float))
          assert d["credits"] >= 12, f"Need at least 12 credits, have {d['credits']}"
          print("STARTING CREDIT BALANCE OK:", d["credits"])
          PY

      - name: Planner spends only planner credits
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 90 --silent --show-error             -X POST             -H "Authorization: Bearer $CORE_API_KEY"             -H "Content-Type: application/json"             -d '{"prompt":"Create a small business dashboard with clients, invoices and settings"}'             "$API/builder/plan" > planner.json
          cat planner.json
          python3 - <<'PY'
          import json
          d=json.load(open("planner.json"))
          assert d["success"] is True, d
          assert d["credits_used"] == 2, d
          assert d["plan"]["project_type"] == "dashboard", d
          print("PLANNER CREDIT USAGE ISOLATION OK")
          print("CREDITS USED:", d["credits_used"])
          print("PROJECT TYPE:", d["plan"]["project_type"])
          PY

      - name: Builder spends only builder credits
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 120 --silent --show-error             -X POST             -H "Authorization: Bearer $CORE_API_KEY"             -H "Content-Type: application/json"             -d '{"prompt":"Build a simple business dashboard with clients, invoices and settings"}'             "$API/builder" > builder.json
          cat builder.json
          python3 - <<'PY'
          import json
          d=json.load(open("builder.json"))
          assert d["success"] is True, d
          assert d["credits_used"] == 10, d
          assert d["project"]["id"], d
          assert d["review"]["passed"] is True, d
          print("BUILDER CREDIT USAGE ISOLATION OK")
          print("CREDITS USED:", d["credits_used"])
          print("PROJECT ID:", d["project"]["id"])
          PY

      - name: Verify exact credit deduction
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 60 --silent --show-error             -H "Authorization: Bearer $CORE_API_KEY"             "$API/credits" > after.json
          cat after.json
          python3 - <<'PY'
          import json
          before=json.load(open("before.json"))
          after=json.load(open("after.json"))
          expected=before["credits"]-12
          assert after["credits"] == expected, (before["credits"], after["credits"], expected)
          print(f"EXACT CREDIT DEDUCTION OK: {before['credits']} -> {after['credits']}")
          print("PLANNER 2 + BUILDER 10 = 12 CREDITS")
          PY

      - name: Verify no unauthorized access
        run: |
          set -euo pipefail
          CODE=$(curl --max-time 30 --silent --output unauthorized.json --write-out "%{http_code}"             "$API/credits")
          test "$CODE" = "401" || {
            echo "Expected 401 without API key, got $CODE"
            cat unauthorized.json
            exit 1
          }
          echo "UNAUTHORIZED CREDIT ACCESS BLOCK OK"

      - name: Cleanup generated project
        if: always()
        run: |
          set +e
          if [ -f builder.json ]; then
            PROJECT_ID=$(python3 -c 'import json; print(json.load(open("builder.json")).get("project",{}).get("id",""))' 2>/dev/null)
            if [ -n "$PROJECT_ID" ]; then
              curl --max-time 60 --silent --show-error                 -X DELETE                 -H "Authorization: Bearer $CORE_API_KEY"                 "$API/projects/$PROJECT_ID" || true
              echo "CLEANUP PROJECT: $PROJECT_ID"
            fi
          fi

      - name: Final result
        run: echo "BUILDER CREDIT USAGE ISOLATION PASSED"
