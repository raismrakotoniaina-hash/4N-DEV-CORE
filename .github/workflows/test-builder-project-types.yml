name: Test Builder Project Types

on:
  workflow_dispatch:

jobs:
  builder-project-types:
    runs-on: ubuntu-latest

    steps:
      - name: Test project type classification
        env:
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          API: https://fourn-dev-core.onrender.com/v1
        run: |
          set -e

          test_type() {
            TYPE="$1"
            PROMPT="$2"

            echo "== TEST: $TYPE =="

            RESPONSE=$(curl --fail-with-body --max-time 90 --silent --show-error               -X POST               -H "Authorization: Bearer $CORE_API_KEY"               -H "Content-Type: application/json"               -d "{\"prompt\":\"$PROMPT\"}"               "$API/builder/plan")

            echo "$RESPONSE"

            echo "$RESPONSE" | python3 - "$TYPE" <<'PY'
import json
import sys

expected = sys.argv[1]
data = json.load(sys.stdin)

assert data["success"] is True, data
assert data["plan"]["project_type"] == expected, data
assert data["credits_used"] == 2, data

print("PLANNER OK |", expected, "| 2 credits")
PY
          }

          test_type "dashboard" "Create an admin dashboard with KPI cards, analytics, searchable data table, settings and responsive navigation"
          test_type "booking" "Create a booking application with services, date and time selection, validation and confirmation"
          test_type "business" "Create a business CRM and invoice application with clients, invoices, dashboard KPIs and settings"
          test_type "crud" "Create an inventory management CRUD application with stock list, search, filters and create edit forms"

          echo "ALL BUILDER PROJECT TYPE PLANNER TESTS PASSED"
