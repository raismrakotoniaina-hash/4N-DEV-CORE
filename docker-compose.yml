services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 4n-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://4ncore:${POSTGRES_PASSWORD}@postgres:5432/4ncore
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - 4n-network

  postgres:
    image: postgres:17-alpine
    container_name: 4n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: 4ncore
      POSTGRES_USER: 4ncore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 4ncore -d 4ncore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 4n-network

volumes:
  postgres_data:

networks:
  4n-network:
    driver: bridge
