services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 4n-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://4ncore:${POSTGRES_PASSWORD}@postgres:5432/4ncore
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - 4n-network

  postgres:
    image: postgres:17-alpine
    container_name: 4n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: 4ncore
      POSTGRES_USER: 4ncore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 4ncore -d 4ncore"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    networks:
      - 4n-network

  nginx:
    image: nginx:1.29-alpine
    container_name: 4n-nginx
    restart: unless-stopped
    depends_on:
      - core
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    networks:
      - 4n-network

  certbot:
    image: certbot/certbot:latest
    container_name: 4n-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - 4n-network

volumes:
  postgres_data:
  certbot_www:
  letsencrypt:

networks:
  4n-network:
    driver: bridge
