services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 4n-core
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://4ncore:${POSTGRES_PASSWORD}@postgres:5432/4ncore
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "3001"
    networks:
      - 4n-network

  postgres:
    image: postgres:17-alpine
    container_name: 4n-postgres
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    environment:
      POSTGRES_DB: 4ncore
      POSTGRES_USER: 4ncore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 4ncore -d 4ncore"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    networks:
      - 4n-network

  nginx:
    image: nginx:1.29-alpine
    container_name: 4n-nginx
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.5"
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    networks:
      - 4n-network

  certbot:
    image: certbot/certbot:latest
    container_name: 4n-certbot
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.25"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - 4n-network

volumes:
  postgres_data:
  certbot_www:
  letsencrypt:

networks:
  4n-network:
    driver: bridge
